# Netlify Configuration for Deadlock Fight Club v2

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Production deployment (main branch only)
[context.production]
  command = "npm run build"

# Branch deploys (non-main branches get preview URLs)
[context.branch-deploy]
  command = "npm run build"

# Deploy previews for pull requests
[context.deploy-preview]
  command = "npm run build"

# SPA routing - but NOT for routes with their own HTML files
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Netlify Configuration for Deadlock Randomizer
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed - static HTML site
  publish = "."
  
[build.environment]
  # No environment variables needed

# Headers for better security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "*.html"
  [headers.values]
    # HTML files should not be cached as aggressively
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects and URL handling
[[redirects]]
  # Redirect old randomizer page to main page
  from = "/deadlock-randomizer.html"
  to = "/"
  status = 301

[[redirects]]
  # Handle SPA routing - redirect all non-file requests to index.html
  from = "/*"
  to = "/index.html"
  status = 200

# Force HTTPS
[[redirects]]
  from = "http://deadlock-randomizer.netlify.app/*"
  to = "https://deadlock-randomizer.netlify.app/:splat"
  status = 301
  force = true

# Custom 404 page (will use index.html as fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
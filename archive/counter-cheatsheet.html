<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Deadlock Counter Cheatsheet - Quick Hero Lookup</title>
    <meta property="og:title" content="Deadlock Counter Cheatsheet - Quick Hero Lookup">
    <meta property="og:description" content="Fast hero-based counter lookup. Type any hero name to see all counter items instantly.">
    <meta property="og:image" content="https://i.ytimg.com/vi/Kdm-3hhR9SA/maxresdefault.jpg">
    <style>
        :root {
            --bg-dark: #0a0a0b;
            --bg-secondary: #1a1a1f;
            --accent-orange: #ff8c42;
            --accent-purple: #7c4dff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-radius: 4px; /* Tighter radius */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 15px;
            line-height: 1.4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px rgba(255, 140, 66, 0.3);
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        .results-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .hero-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hero-section.hidden {
            display: none;
        }

        .hero-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-count {
            background: var(--accent-purple);
            color: white;
            padding: 2px 8px;
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            font-weight: normal;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }

        .item-mini {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 10px;
            border-left: 3px solid var(--accent-orange);
            transition: all 0.2s ease;
        }

        .item-mini:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
        }

        .item-mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .item-mini-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .item-mini-cost {
            background: var(--accent-orange);
            color: white;
            padding: 2px 6px;
            border-radius: var(--border-radius);
            font-size: 0.75rem;
            font-weight: bold;
        }

        .item-mini-effect {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-style: italic;
        }

        .item-category-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: var(--border-radius);
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 6px;
        }

        .badge-passive { background: rgba(76, 175, 80, 0.3); color: #4caf50; }
        .badge-active { background: rgba(33, 150, 243, 0.3); color: #2196f3; }
        .badge-anti-heal { background: rgba(156, 39, 176, 0.3); color: #9c27b0; }
        .badge-bonus { background: rgba(255, 152, 0, 0.3); color: #ff9800; }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .no-results.hidden {
            display: none;
        }

        .back-link {
            display: inline-block;
            color: var(--accent-orange);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent-purple);
            transform: translateX(-3px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6rem;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Fight Club</a>

        <div class="header">
            <h1>Counter Cheatsheet</h1>
            <p class="subtitle">Type any hero name for instant counter items</p>
        </div>

        <div class="search-container">
            <input
                type="text"
                id="heroSearch"
                class="search-box"
                placeholder="Search hero (e.g., Bebop, Abrams, Grey Talon)..."
                onkeyup="filterHeroes()"
                autofocus
            >
        </div>

        <div class="results-info" id="resultsInfo">Showing all heroes</div>

        <div id="heroesContainer"></div>

        <div class="no-results hidden" id="noResults">
            No heroes found matching your search.
        </div>
    </div>

    <script>
        // Hero-centric data structure
        const heroCounters = {
            "Abrams": [
                { name: "Reactive Barrier", cost: 1600, category: "Passive", effect: "Auto-barrier on CC (Shoulder Charge)" },
                { name: "Debuff Reducer", cost: null, category: "Passive", effect: "Reduces stun duration" },
                { name: "Slowing Hex", cost: null, category: "Active", effect: "Stop his chase" },
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" }
            ],
            "Bebop": [
                { name: "Reactive Barrier", cost: 1600, category: "Passive", effect: "Auto-barrier on Hook" },
                { name: "Counterspell", cost: null, category: "Active", effect: "Parry Hook, Bomb, Uppercut" },
                { name: "Knockdown", cost: null, category: "Active", effect: "Cancel his ultimate" }
            ],
            "Billy": [
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" },
                { name: "Toxic Bullet", cost: 3200, category: "Anti-Heal", effect: "Bleed + 30% heal reduction" }
            ],
            "Calico": [
                { name: "Counterspell", cost: null, category: "Active", effect: "Parry bombs" },
                { name: "Silence Glyph", cost: null, category: "Active", effect: "Suppress abilities" },
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" }
            ],
            "Doorman": [
                { name: "Reactive Barrier", cost: 1600, category: "Passive", effect: "Auto-barrier on Cart Combo" }
            ],
            "Drifter": [
                { name: "Divine Barrier", cost: null, category: "Bonus", effect: "Cleanse ultimate" }
            ],
            "Dynamo": [
                { name: "Curse", cost: null, category: "Active", effect: "Interrupt his ultimate" },
                { name: "Knockdown", cost: null, category: "Active", effect: "Cancel ultimate" }
            ],
            "Grey Talon": [
                { name: "Spellbreaker", cost: 6400, category: "Passive", effect: "Best spirit resist - makes him useless" },
                { name: "Counterspell", cost: null, category: "Active", effect: "Parry ultimate" }
            ],
            "Haze": [
                { name: "Suppressor", cost: null, category: "Bonus", effect: "-30% fire rate" },
                { name: "Return Fire", cost: null, category: "Bonus", effect: "Reflect bullets" },
                { name: "Metal Skin", cost: null, category: "Bonus", effect: "5s bullet immunity" },
                { name: "Battle Vest", cost: null, category: "Passive", effect: "Bullet resist + fire rate" }
            ],
            "Holiday": [
                { name: "Debuff Reducer", cost: null, category: "Passive", effect: "Reduces Lasso duration" },
                { name: "Counterspell", cost: null, category: "Active", effect: "Parry Lasso" }
            ],
            "Infernus": [
                { name: "Plated Armor", cost: null, category: "Passive", effect: "Deflects burn build-up" }
            ],
            "Ivy": [
                { name: "Slowing Hex", cost: null, category: "Active", effect: "Stop ultimate" }
            ],
            "Kelvin": [
                { name: "Enduring Speed", cost: null, category: "Bonus", effect: "30% slow resist" },
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" }
            ],
            "Lady Geist": [
                { name: "Silence Glyph", cost: null, category: "Active", effect: "Suppress low HP ultimate" },
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" }
            ],
            "Lash": [
                { name: "Counterspell", cost: null, category: "Active", effect: "Parry Slam" }
            ],
            "Mirage": [
                { name: "Slowing Hex", cost: null, category: "Active", effect: "Stop bat escape" },
                { name: "Spirit Burn", cost: null, category: "Anti-Heal", effect: "70% heal reduction + massive damage" },
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" }
            ],
            "Moe": [
                { name: "Debuff Reducer", cost: null, category: "Passive", effect: "Reduces ultimate duration" },
                { name: "Knockdown", cost: null, category: "Active", effect: "Cancel ultimate + stop burrowing" },
                { name: "Toxic Bullet", cost: 3200, category: "Anti-Heal", effect: "% max HP bleed damage" }
            ],
            "Paige": [
                { name: "Counterspell", cost: null, category: "Active", effect: "Parry ultimate" },
                { name: "Capacitor", cost: null, category: "Bonus", effect: "Remove shields" }
            ],
            "Pocket": [
                { name: "Divine Barrier", cost: null, category: "Bonus", effect: "Cleanse ultimate" }
            ],
            "Seven": [
                { name: "Capacitor", cost: null, category: "Bonus", effect: "Remove Power Surge buff" }
            ],
            "Shiv": [
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" },
                { name: "Toxic Bullet", cost: 3200, category: "Anti-Heal", effect: "Bleed + 30% heal reduction" }
            ],
            "Victor": [
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction (early)" },
                { name: "Crippling Headshot", cost: null, category: "Anti-Heal", effect: "-18% resists + 30% heal reduction" },
                { name: "Inhibitor", cost: 6400, category: "Anti-Heal", effect: "35% heal reduction + 35% damage reduction" }
            ],
            "Vindicta": [
                { name: "Spellbreaker", cost: 6400, category: "Passive", effect: "Protection against snipes" }
            ],
            "Viscous": [
                { name: "Rebuttal", cost: 800, category: "Active", effect: "Parry Puddle Punch and return damage" },
                { name: "Capacitor", cost: null, category: "Bonus", effect: "Remove cube buffs" }
            ],
            "Wraith": [
                { name: "Suppressor", cost: null, category: "Bonus", effect: "-30% fire rate" }
            ],
            "Yamato": [
                { name: "Silence Glyph", cost: null, category: "Active", effect: "Suppress low HP ultimate" },
                { name: "Heelsbane", cost: 1600, category: "Anti-Heal", effect: "35% heal reduction" }
            ]
        };

        function renderHeroes() {
            const container = document.getElementById('heroesContainer');
            container.innerHTML = '';

            const sortedHeroes = Object.keys(heroCounters).sort();

            sortedHeroes.forEach(hero => {
                const items = heroCounters[hero];
                const section = document.createElement('div');
                section.className = 'hero-section';
                section.dataset.hero = hero.toLowerCase();

                const header = document.createElement('div');
                header.className = 'hero-name';
                header.innerHTML = `
                    ${hero}
                    <span class="item-count">${items.length} counter${items.length > 1 ? 's' : ''}</span>
                `;

                const grid = document.createElement('div');
                grid.className = 'items-grid';

                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item-mini';

                    const categoryClass = `badge-${item.category.toLowerCase().replace(' ', '-')}`;
                    const costDisplay = item.cost ? item.cost : '—';

                    itemDiv.innerHTML = `
                        <div class="item-mini-header">
                            <span class="item-mini-name">${item.name}</span>
                            <span class="item-mini-cost">${costDisplay}</span>
                        </div>
                        <div class="item-mini-effect">${item.effect}</div>
                        <span class="item-category-badge ${categoryClass}">${item.category}</span>
                    `;
                    grid.appendChild(itemDiv);
                });

                section.appendChild(header);
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function filterHeroes() {
            const input = document.getElementById('heroSearch');
            const filter = input.value.toLowerCase().trim();
            const sections = document.querySelectorAll('.hero-section');
            const noResults = document.getElementById('noResults');
            const resultsInfo = document.getElementById('resultsInfo');
            let visibleCount = 0;

            sections.forEach(section => {
                const hero = section.dataset.hero;
                if (filter === '' || hero.indexOf(filter) > -1) {
                    section.classList.remove('hidden');
                    visibleCount++;
                } else {
                    section.classList.add('hidden');
                }
            });

            // Update results info
            if (filter === '') {
                resultsInfo.textContent = 'Showing all heroes';
            } else {
                resultsInfo.textContent = `Found ${visibleCount} hero${visibleCount !== 1 ? 'es' : ''}`;
            }

            // Show/hide no results
            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // Initialize
        renderHeroes();
    </script>
</body>
</html>

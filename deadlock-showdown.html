<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Showdown - Hero Comparison</title>
    <style>
        /* CSS Custom Properties for Deadlock Theme */
        :root {
            /* Deadlock Color Scheme */
            --bg-primary: #0a0a0b;
            --bg-secondary: #1a1a1f;
            --bg-tertiary: #252530;
            --accent-orange: #ff8c42;
            --accent-orange-hover: #ffaa66;
            --accent-purple: #7c4dff;
            --accent-purple-dark: #5e39db;
            --text-primary: #ffffff;
            --text-secondary: #b8b8c8;
            --text-muted: #808090;
            --border-color: #404050;
            --placeholder-bg: #2d2d3a;
            --vs-blue: #007acc;
            --vs-blue-hover: #1e88e5;
            
            /* Layout Properties */
            --container-max-width: 1400px;
            --hero-size: 200px;
            --item-size: 100px;
            --border-radius: 8px;
            --transition-speed: 0.3s;
            --animation-duration: 0.6s;
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container and Layout */
        .main-container {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown var(--animation-duration) ease-out;
        }

        .title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(45deg, var(--accent-orange), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 20px rgba(255, 140, 66, 0.3);
        }

        .generate-button {
            background: linear-gradient(45deg, var(--accent-orange), var(--accent-orange-hover));
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 1rem 3rem;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
            position: relative;
            overflow: hidden;
        }

        .generate-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .generate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 140, 66, 0.4);
        }

        .generate-button:hover::before {
            left: 100%;
        }

        .generate-button:active {
            transform: translateY(0);
        }

        /* VS Section */
        .vs-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 2rem;
            align-items: center;
            margin-bottom: 4rem;
            animation: fadeInUp var(--animation-duration) ease-out 0.2s both;
        }

        .player-section {
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 2rem;
            text-align: center;
            transition: all var(--transition-speed) ease;
            position: relative;
            overflow: hidden;
        }

        .player-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
            transform: scaleX(0);
            transition: transform var(--transition-speed) ease;
        }

        .player-section:hover {
            border-color: var(--accent-orange);
            box-shadow: 0 8px 30px rgba(255, 140, 66, 0.2);
            transform: translateY(-4px);
        }

        .player-section:hover::before {
            transform: scaleX(1);
        }

        .player-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .player-section:nth-child(1) .player-title {
            color: var(--accent-orange);
        }

        .player-section:nth-child(3) .player-title {
            color: var(--accent-purple);
        }

        /* Hero Placeholder */
        .hero-placeholder {
            width: var(--hero-size);
            height: var(--hero-size);
            background: var(--placeholder-bg);
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all var(--transition-speed) ease;
            overflow: hidden;
        }

        .hero-placeholder::before {
            content: 'HERO PORTRAIT\A200x200px';
            white-space: pre;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .hero-placeholder:hover {
            border-color: var(--accent-orange);
            background: rgba(255, 140, 66, 0.1);
            transform: scale(1.05);
        }

        .hero-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            min-height: 1.5rem;
            border-bottom: 2px solid transparent;
            transition: border-color var(--transition-speed) ease;
            letter-spacing: 0.02em;
        }

        .hero-name:hover {
            border-bottom-color: var(--accent-orange);
        }

        /* VS Divider */
        .vs-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .vs-text {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: pulse 2s ease-in-out infinite alternate;
            letter-spacing: 0.1em;
        }

        .vs-line {
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, var(--accent-orange), var(--accent-purple));
            margin: 1rem 0;
            border-radius: 1px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        /* Shared Items Section */
        .shared-items {
            animation: fadeInUp var(--animation-duration) ease-out 0.4s both;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--item-size), 1fr));
            gap: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Item Placeholder */
        .item-placeholder {
            width: var(--item-size);
            height: var(--item-size);
            background: var(--placeholder-bg);
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all var(--transition-speed) ease;
            cursor: pointer;
            margin: 0 auto;
        }

        .item-placeholder::before {
            content: 'ITEM\A100x100px';
            white-space: pre;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .item-placeholder:hover {
            border-color: var(--vs-blue);
            background: rgba(0, 122, 204, 0.1);
            transform: scale(1.1) rotate(3deg);
        }

        .item-placeholder:nth-child(odd):hover {
            transform: scale(1.1) rotate(-3deg);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.05);
            }
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 10px rgba(255, 140, 66, 0.5);
            }
            100% {
                box-shadow: 0 0 20px rgba(124, 77, 255, 0.7);
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-container {
                padding: 1.5rem;
            }
            
            .vs-section {
                gap: 1.5rem;
            }
            
            :root {
                --hero-size: 180px;
                --item-size: 90px;
            }
        }

        @media (max-width: 768px) {
            .vs-section {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .vs-divider {
                order: 2;
                flex-direction: row;
            }
            
            .vs-line {
                width: 60px;
                height: 2px;
                margin: 0 1rem;
            }
            
            .vs-text {
                font-size: 2.5rem;
            }
            
            :root {
                --hero-size: 160px;
                --item-size: 80px;
            }
            
            .items-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 1rem;
            }
            
            .player-section {
                padding: 1.5rem;
            }
            
            :root {
                --hero-size: 140px;
                --item-size: 70px;
            }
            
            .generate-button {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus Styles for Keyboard Navigation */
        .generate-button:focus,
        .hero-placeholder:focus,
        .item-placeholder:focus {
            outline: 2px solid var(--accent-orange);
            outline-offset: 2px;
        }

        /* Selection Animation Classes (for JavaScript integration) */
        .hero-reveal {
            animation: heroReveal var(--animation-duration) ease-out;
        }

        .item-reveal {
            animation: itemReveal var(--animation-duration) ease-out;
        }

        @keyframes heroReveal {
            0% {
                opacity: 0;
                transform: scale(0.8) rotateY(90deg);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.1) rotateY(45deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        @keyframes itemReveal {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(180deg);
            }
            60% {
                opacity: 0.8;
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="title">DEADLOCK SHOWDOWN</h1>
            <button class="generate-button" onclick="triggerGeneration()">GENERATE</button>
        </header>

        <!-- VS Section -->
        <section class="vs-section">
            <!-- Player 1 -->
            <div class="player-section">
                <h2 class="player-title">PLAYER 1</h2>
                <div class="hero-placeholder" tabindex="0" role="img" aria-label="Player 1 hero portrait placeholder"></div>
                <div class="hero-name">Select Hero</div>
            </div>

            <!-- VS Divider -->
            <div class="vs-divider">
                <div class="vs-line"></div>
                <div class="vs-text">VS</div>
                <div class="vs-line"></div>
            </div>

            <!-- Player 2 -->
            <div class="player-section">
                <h2 class="player-title">PLAYER 2</h2>
                <div class="hero-placeholder" tabindex="0" role="img" aria-label="Player 2 hero portrait placeholder"></div>
                <div class="hero-name">Select Hero</div>
            </div>
        </section>

        <!-- Shared Items Section -->
        <section class="shared-items">
            <h2 class="section-title">SHARED ITEMS</h2>
            <div class="items-grid">
                <div class="item-placeholder" tabindex="0" role="img" aria-label="Shared item slot 1"></div>
                <div class="item-placeholder" tabindex="0" role="img" aria-label="Shared item slot 2"></div>
                <div class="item-placeholder" tabindex="0" role="img" aria-label="Shared item slot 3"></div>
                <div class="item-placeholder" tabindex="0" role="img" aria-label="Shared item slot 4"></div>
            </div>
        </section>
    </div>

    <script>
        // Demo JavaScript for interaction and animations
        function triggerGeneration() {
            // Add generation animation classes
            const heroPlaceholders = document.querySelectorAll('.hero-placeholder');
            const itemPlaceholders = document.querySelectorAll('.item-placeholder');
            const heroNames = document.querySelectorAll('.hero-name');
            
            // Reset previous animations
            heroPlaceholders.forEach(hero => {
                hero.classList.remove('hero-reveal');
            });
            itemPlaceholders.forEach(item => {
                item.classList.remove('item-reveal');
            });
            
            // Trigger hero reveals with staggered timing
            setTimeout(() => {
                heroPlaceholders[0].classList.add('hero-reveal');
                heroNames[0].textContent = 'Hero Loading...';
            }, 200);
            
            setTimeout(() => {
                heroPlaceholders[1].classList.add('hero-reveal');
                heroNames[1].textContent = 'Hero Loading...';
            }, 400);
            
            // Trigger item reveals with staggered timing
            itemPlaceholders.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('item-reveal');
                }, 600 + (index * 100));
            });
            
            // Simulate completion
            setTimeout(() => {
                heroNames.forEach(name => {
                    name.textContent = 'Ready for Battle';
                });
            }, 1500);
        }
        
        // Add keyboard interaction for accessibility
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                if (e.target.classList.contains('hero-placeholder') || 
                    e.target.classList.contains('item-placeholder')) {
                    e.preventDefault();
                    e.target.click();
                }
            }
        });
        
        // Add click handlers for placeholders (demo purposes)
        document.querySelectorAll('.hero-placeholder').forEach(hero => {
            hero.addEventListener('click', () => {
                hero.style.background = 'linear-gradient(45deg, var(--accent-orange), var(--accent-purple))';
                hero.style.borderStyle = 'solid';
                hero.innerHTML = '<div style="color: white; font-weight: bold;">SELECTED</div>';
            });
        });
        
        document.querySelectorAll('.item-placeholder').forEach(item => {
            item.addEventListener('click', () => {
                item.style.background = 'linear-gradient(45deg, var(--vs-blue), var(--accent-purple))';
                item.style.borderStyle = 'solid';
                item.innerHTML = '<div style="color: white; font-weight: bold; font-size: 0.7rem;">EQUIPPED</div>';
            });
        });
    </script>
</body>
</html>

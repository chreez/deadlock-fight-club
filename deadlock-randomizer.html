        /**
         * Core weighted random selection using cumulative distribution
         * @param {Array} items - Array of objects with optional weight property
         * @param {Function} weightFn - Function to calculate weight for each item
         * @returns {Object} Selected item
         */
        function weightedRandomSelect(items, weightFn = (item) => item.weight || 1) {
            if (!items || items.length === 0) {
                throw new Error("Cannot select from empty array");
            }
            
            const weights = items.map(weightFn);
            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            
            if (totalWeight <= 0) {
                // Fallback to uniform distribution if weights are invalid
                return items[Math.floor(Math.random() * items.length)];
            }
            
            const random = Math.random() * totalWeight;
            let cumulative = 0;
            
            for (let i = 0; i < items.length; i++) {
                cumulative += weights[i];
                if (random < cumulative) {
                    return items[i];
                }
            }
            
            return items[items.length - 1]; // Fallback
        }

        /**
         * Fisher-Yates shuffle for truly random permutation
         * @param {Array} array - Array to shuffle
         * @returns {Array} New shuffled array
         */
        function shuffle(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        /**
         * Select random hero with optional filters
         * @param {Object} options - Selection options
         * @returns {Object} Selected hero
         */
        function getRandomHero(options = {}) {
            const { role, difficulty, exclude = [] } = options;
            
            let pool = HEROES.filter(hero => !exclude.includes(hero.name));
            
            if (role) {
                pool = pool.filter(hero => hero.role === role);
            }
            
            if (difficulty) {
                pool = pool.filter(hero => hero.difficulty === difficulty);
            }
            
            if (pool.length === 0) {
                throw new Error("No heroes match the specified criteria");
            }
            
            return pool[Math.floor(Math.random() * pool.length)];
        }

        /**
         * Select multiple unique heroes
         * @param {Number} count - Number of heroes to select
         * @param {Object} options - Selection options
         * @returns {Array} Array of selected heroes
         */
        function getRandomHeroes(count, options = {}) {
            const { allowDuplicates = false } = options;
            
            if (!allowDuplicates && count > HEROES.length) {
                throw new Error(`Cannot select ${count} unique heroes from pool of ${HEROES.length}`);
            }
            
            if (allowDuplicates) {
                return Array.from({ length: count }, () => getRandomHero(options));
            }
            
            const selected = [];
            const exclude = [...(options.exclude || [])];
            
            for (let i = 0; i < count; i++) {
                const hero = getRandomHero({ ...options, exclude });
                selected.push(hero);
                exclude.push(hero.name);
            }
            
            return selected;
        }

        /**
         * Generate a balanced team composition
         * @param {Number} teamSize - Size of the team
         * @returns {Array} Array of heroes forming a balanced team
         */
        function generateBalancedTeam(teamSize = 6) {
            const composition = {
                tank: Math.max(1, Math.floor(teamSize * 0.25)),
                damage: Math.ceil(teamSize * 0.5),
                support: Math.floor(teamSize * 0.25)
            };
            
            // Adjust if numbers don't add up
            const total = composition.tank + composition.damage + composition.support;
            if (total < teamSize) {
                composition.damage += teamSize - total;
            }
            
            const team = [];
            const exclude = [];
            
            for (const [role, count] of Object.entries(composition)) {
                for (let i = 0; i < count; i++) {
                    const hero = getRandomHero({ role, exclude });
                    team.push(hero);
                    exclude.push(hero.name);
                }
            }
            
            return shuffle(team); // Shuffle to mix roles
        }

        /**
         * Generate random item build with budget constraints
         * @param {Number} budget - Total soul budget
         * @param {Object} options - Build options
         * @returns {Object} Item build with categories
         */
        function generateRandomBuild(budget = 20000, options = {}) {
            const { 
                weaponRatio = 0.33,
                vitalityRatio = 0.33,
                spiritRatio = 0.34,
                maxItemsPerCategory = 4
            } = options;
            
            const build = {
                weapon: [],
                vitality: [],
                spirit: [],
                totalCost: 0
            };
            
            // Calculate budget per category
            const budgets = {
                weapon: Math.floor(budget * weaponRatio),
                vitality: Math.floor(budget * vitalityRatio),
                spirit: Math.floor(budget * spiritRatio)
            };
            
            // Helper function to fill category
            const fillCategory = (items, categoryBudget, maxItems) => {
                const selected = [];
                let remaining = categoryBudget;
                let attempts = 0;
                const maxAttempts = 50;
                
                while (selected.length < maxItems && remaining > 0 && attempts < maxAttempts) {
                    attempts++;
                    
                    // Filter affordable items not already selected
                    const affordable = items.filter(item => 
                        item.cost <= remaining && 
                        !selected.some(s => s.name === item.name)
                    );
                    
                    if (affordable.length === 0) break;
                    
                    // Weight by tier (higher tier = more weight if we can afford it)
                    const item = weightedRandomSelect(affordable, (item) => {
                        const tierWeight = item.tier * item.tier; // Exponential weight
                        const costEfficiency = item.cost / remaining; // Prefer items that use budget efficiently
                        return tierWeight * costEfficiency;
                    });
                    
                    selected.push(item);
                    remaining -= item.cost;
                }
                
                return { items: selected, spent: categoryBudget - remaining };
            };
            
            // Fill each category
            const weaponResult = fillCategory(WEAPON_ITEMS, budgets.weapon, maxItemsPerCategory);
            build.weapon = weaponResult.items;
            
            const vitalityResult = fillCategory(VITALITY_ITEMS, budgets.vitality, maxItemsPerCategory);
            build.vitality = vitalityResult.items;
            
            const spiritResult = fillCategory(SPIRIT_ITEMS, budgets.spirit, maxItemsPerCategory);
            build.spirit = spiritResult.items;
            
            build.totalCost = weaponResult.spent + vitalityResult.spent + spiritResult.spent;
            
            return build;
        }

        /**
         * Generate a balanced item build based on hero role
         * @param {String} heroRole - Role of the hero
         * @param {Number} budget - Total soul budget
         * @returns {Object} Balanced item build
         */
        function generateBalancedBuild(heroRole = null, budget = 20000) {
            const ratios = {
                tank: { weaponRatio: 0.2, vitalityRatio: 0.6, spiritRatio: 0.2 },
                damage: { weaponRatio: 0.6, vitalityRatio: 0.2, spiritRatio: 0.2 },
                support: { weaponRatio: 0.2, vitalityRatio: 0.3, spiritRatio: 0.5 }
            };
            
            const buildRatios = heroRole && ratios[heroRole] 
                ? ratios[heroRole] 
                : { weaponRatio: 0.33, vitalityRatio: 0.33, spiritRatio: 0.34 };
            
            return generateRandomBuild(budget, buildRatios);
        }

        /**
         * Generate random match items based on selected game mode
         * @param {String} mode - Game mode for item selection
         * @returns {Array} Array of 4 selected items
         */
        function generateMatchItems(mode = 'all-random') {
            let itemPool = [...ALL_ITEMS];
            let selectedItems = [];
            
            switch(mode) {
                case 'all-random':
                    // Any 4 random items from entire pool
                    selectedItems = shuffle(itemPool).slice(0, 4);
                    break;
                    
                case 'balanced':
                    // 1-2 items from each category
                    const categories = ['weapon', 'vitality', 'spirit'];
                    const distribution = shuffle([1, 1, 2]); // Random distribution that sums to 4
                    
                    categories.forEach((cat, idx) => {
                        const categoryItems = itemPool.filter(i => i.category === cat);
                        const count = distribution[idx];
                        const selected = shuffle(categoryItems).slice(0, count);
                        selectedItems.push(...selected);
                    });
                    
                    // Add one more random item from any category
                    const remainingPool = itemPool.filter(i => 
                        !selectedItems.some(s => s.name === i.name)
                    );
                    selectedItems.push(shuffle(remainingPool)[0]);
                    selectedItems = shuffle(selectedItems).slice(0, 4);
                    break;
                    
                case 'budget':
                    // Only tier 1-2 items
                    itemPool = itemPool.filter(i => i.tier <= 2);
                    selectedItems = shuffle(itemPool).slice(0, 4);
                    break;
                    
                case 'late-game':
                    // Only tier 3-4 items
                    itemPool = itemPool.filter(i => i.tier >= 3);
                    selectedItems = shuffle(itemPool).slice(0, 4);
                    break;
                    
                case 'chaos':
                    // Weighted random favoring extremes (tier 1 and 4)
                    const weightFn = (item) => {
                        if (item.tier === 1 || item.tier === 4) return 3;
                        if (item.tier === 2 || item.tier === 3) return 1;
                        return 1;
                    };
                    
                    for (let i = 0; i < 4; i++) {
                        const available = itemPool.filter(item => 
                            !selectedItems.some(s => s.name === item.name)
                        );
                        if (available.length === 0) break;
                        
                        const selected = weightedRandomSelect(available, weightFn);
                        selectedItems.push(selected);
                    }
                    break;
                    
                default:
                    selectedItems = shuffle(itemPool).slice(0, 4);
            }
            
            return selectedItems;
        }

        /**
         * Display match items with enhanced visuals
         */
        function generateMatch() {
            const modeSelect = document.getElementById('gameMode');
            const mode = modeSelect.value;
            const items = generateMatchItems(mode);
            
            let html = `<h3>Match Items - ${modeSelect.options[modeSelect.selectedIndex].text}</h3>`;
            html += '<div class="match-display">';
            
            items.forEach(item => {
                const categoryClass = `${item.category}-item`;
                const tierClass = `tier-${item.tier}`;
                
                html += `
                    <div class="match-item ${categoryClass} ${tierClass}">
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            <span class="tier-badge tier-${item.tier}-badge">T${item.tier}</span>
                        </div>
                        <span class="cost-badge">${item.cost} souls</span>
                    </div>
                `;
            });
            
            html += '</div>';
            
            // Calculate total cost
            const totalCost = items.reduce((sum, item) => sum + item.cost, 0);
            html += `<p style="text-align: center; margin-top: 15px; color: #ffd700;">Total Cost: ${totalCost} souls</p>`;
            
            document.getElementById('itemResult').innerHTML = html;
        }

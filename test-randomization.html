<!DOCTYPE html>
<html>
<head>
    <title>Randomization Test</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #ccc; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #264f78; color: white; border: none; cursor: pointer; }
        #results { margin-top: 20px; }
        .test-section { margin: 20px 0; padding: 15px; background: #2d2d30; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Deadlock Randomizer - Randomization Test</h1>
    <button onclick="runTests()">Run Randomization Tests</button>
    <button onclick="clearResults()">Clear</button>
    <div id="results"></div>

    <script>
        // Copy the game data and functions from index.html
        const gameData = {
            heroes: [
                { name: "Abrams", role: "initiator" },
                { name: "Bebop", role: "initiator" },
                { name: "Calico", role: "carry" },
                { name: "Dynamo", role: "support" },
                { name: "Grey Talon", role: "carry" },
                { name: "Haze", role: "carry" },
                { name: "Holliday", role: "carry" },
                { name: "Infernus", role: "flex" },
                { name: "Ivy", role: "support" },
                { name: "Kelvin", role: "initiator" },
                { name: "Lady Geist", role: "flex" },
                { name: "Lash", role: "initiator" },
                { name: "McGinnis", role: "support" },
                { name: "Mirage", role: "flex" },
                { name: "Mo & Krill", role: "initiator" },
                { name: "Paradox", role: "flex" },
                { name: "Pocket", role: "support" },
                { name: "Seven", role: "flex" },
                { name: "Shiv", role: "carry" },
                { name: "Sinclair", role: "flex" },
                { name: "Vindicta", role: "carry" },
                { name: "Viscous", role: "support" },
                { name: "Vyper", role: "carry" },
                { name: "Warden", role: "initiator" },
                { name: "Wraith", role: "carry" },
                { name: "Yamato", role: "flex" },
                { name: "Mina", role: "support" },
                { name: "Billy", role: "carry" },
                { name: "Paige", role: "flex" },
                { name: "The Doorman", role: "initiator" },
                { name: "Victor", role: "flex" },
                { name: "Drifter", role: "carry" }
            ],
            items: {
                weapon: [
                    { name: "Basic Magazine", cost: 500, tier: 1 },
                    { name: "Close Quarters", cost: 1250, tier: 2 },
                    { name: "Headshot Booster", cost: 1250, tier: 2 }
                ],
                vitality: [
                    { name: "Extra Health", cost: 500, tier: 1 },
                    { name: "Extra Regen", cost: 500, tier: 1 },
                    { name: "Extra Stamina", cost: 500, tier: 1 }
                ],
                spirit: [
                    { name: "Extra Spirit", cost: 500, tier: 1 },
                    { name: "Mystic Burst", cost: 500, tier: 1 },
                    { name: "Mystic Reach", cost: 500, tier: 1 }
                ]
            }
        };

        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function getRandomElements(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            // Test 1: Hero Distribution Test (1000 iterations)
            const heroTest = document.createElement('div');
            heroTest.className = 'test-section';
            heroTest.innerHTML = '<h3>Test 1: Hero Distribution (1000 random selections)</h3>';
            
            const heroCounts = {};
            for (let i = 0; i < 1000; i++) {
                const hero = getRandomElement(gameData.heroes);
                heroCounts[hero.name] = (heroCounts[hero.name] || 0) + 1;
            }
            
            heroTest.innerHTML += '<p>Expected average: ~' + (1000 / gameData.heroes.length).toFixed(1) + ' per hero</p>';
            heroTest.innerHTML += '<p>Results (showing top 5 and bottom 5):</p>';
            
            const sortedHeroes = Object.entries(heroCounts).sort((a, b) => b[1] - a[1]);
            heroTest.innerHTML += '<pre>Top 5:\n' + sortedHeroes.slice(0, 5).map(([name, count]) => 
                `  ${name}: ${count} times`).join('\n') + '</pre>';
            heroTest.innerHTML += '<pre>Bottom 5:\n' + sortedHeroes.slice(-5).map(([name, count]) => 
                `  ${name}: ${count} times`).join('\n') + '</pre>';
            
            results.appendChild(heroTest);
            
            // Test 2: Item Randomization Test
            const itemTest = document.createElement('div');
            itemTest.className = 'test-section';
            itemTest.innerHTML = '<h3>Test 2: Item Pool Randomization (100 matches)</h3>';
            
            const allItems = [
                ...gameData.items.weapon,
                ...gameData.items.vitality,
                ...gameData.items.spirit
            ];
            
            const itemCounts = {};
            for (let i = 0; i < 100; i++) {
                const items = getRandomElements(allItems, 4);
                items.forEach(item => {
                    itemCounts[item.name] = (itemCounts[item.name] || 0) + 1;
                });
            }
            
            const sortedItems = Object.entries(itemCounts).sort((a, b) => b[1] - a[1]);
            itemTest.innerHTML += '<p>Total unique items selected: ' + sortedItems.length + '</p>';
            itemTest.innerHTML += '<pre>Most common items:\n' + sortedItems.slice(0, 5).map(([name, count]) => 
                `  ${name}: ${count} times`).join('\n') + '</pre>';
            
            results.appendChild(itemTest);
            
            // Test 3: Mirror Match Frequency
            const mirrorTest = document.createElement('div');
            mirrorTest.className = 'test-section';
            mirrorTest.innerHTML = '<h3>Test 3: Mirror Match Frequency (1000 matches)</h3>';
            
            let mirrorCount = 0;
            for (let i = 0; i < 1000; i++) {
                const hero1 = getRandomElement(gameData.heroes);
                const hero2 = getRandomElement(gameData.heroes);
                if (hero1.name === hero2.name) {
                    mirrorCount++;
                }
            }
            
            mirrorTest.innerHTML += '<p>Expected probability: ~' + (100 / gameData.heroes.length).toFixed(2) + '%</p>';
            mirrorTest.innerHTML += '<p>Actual mirror matches: ' + mirrorCount + '/1000 (' + 
                (mirrorCount / 10).toFixed(2) + '%)</p>';
            
            results.appendChild(mirrorTest);
            
            // Test 4: Verify all 32 heroes present
            const verifyTest = document.createElement('div');
            verifyTest.className = 'test-section';
            verifyTest.innerHTML = '<h3>Test 4: Hero Pool Verification</h3>';
            verifyTest.innerHTML += '<p>Total heroes in pool: ' + gameData.heroes.length + '</p>';
            verifyTest.innerHTML += '<p>Expected: 32</p>';
            verifyTest.innerHTML += '<p>Status: ' + (gameData.heroes.length === 32 ? '✅ PASS' : '❌ FAIL') + '</p>';
            
            results.appendChild(verifyTest);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
</body>
</html>
